<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عقارات دەشتی دوستەپە</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #10b981;
      --dark: #0f172a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #ef4444;
      --edit: #f59e0b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .logo { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .btn {
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-admin { background: var(--dark); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-call { background: #10b981; color: #fff; font-size: 0.82rem; padding: 0.6rem 0.9rem; border-radius: 9px; flex: 1; text-align: center; }
    .btn-edit { background: var(--edit); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-map { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size: 0.78rem; padding: 0.45rem 0.75rem; border-radius: 8px; }

    .admin-bar {
      background: #0f172a;
      color: #fff;
      padding: 0.75rem 1rem;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .admin-bar-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .admin-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
    }
    .hero h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; }
    .hero p { color: #94a3b8; font-size: 0.85rem; max-width: 500px; margin: auto; }

    .container { max-width: 1100px; margin: auto; padding: 1.2rem 1rem; }

    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    
    .tab-btn {
      padding: 0.65rem 1.2rem;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .sub-tabs-container {
      display: none;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 10px;
      margin-bottom: 15px;
      gap: 5px;
    }
    .sub-tab-btn {
      flex: 1;
      padding: 0.5rem;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }
    .sub-tab-btn.active {
      background: #ffffff;
      color: var(--dark);
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .grid { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    @media(min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media(min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .card-img-wrapper {
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .card-img { 
      width: 100%; 
      height: 220px; 
      object-fit: cover; 
      display: block; 
      background: #e2e8f0;
    }
    .img-count-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .badge-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0.5rem; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      background: #e0f2fe;
      color: var(--primary);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-sub { background: #fef3c7; color: #b45309; }
    .badge-location { background: #f1f5f9; color: var(--dark); border: 1px solid #cbd5e1; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--dark); margin-bottom: 0.4rem; cursor: pointer; }
    .card-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.8rem; line-height: 1.5; flex: 1; }
    
    .map-row { margin-bottom: 0.8rem; }

    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #f1f5f9;
      padding-top: 0.75rem;
    }
    .card-footer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .card-controls { display: none; gap: 6px; margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    @media(min-width: 640px) { .modal { align-items: center; } }

    .modal-content {
      background: #fff;
      padding: 1.3rem;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }
    @media(min-width: 640px) { .modal-content { border-radius: 16px; } }

    .modal-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .close-btn { position: absolute; left: 1rem; top: 1rem; cursor: pointer; font-size: 1.4rem; font-weight: 800; color: #94a3b8; }
    .empty-state { text-align: center; color: var(--muted); padding: 3.5rem 1rem; font-size: 0.95rem; font-weight: 600; }

    /* گەلەری Modal */
    .gallery-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 300;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
    }
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    .gallery-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      max-width: 800px;
      width: 100%;
      margin: auto;
    }
    .gallery-main img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 12px;
    }
    .gallery-nav-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .gallery-prev { right: 10px; }
    .gallery-next { left: 10px; }
    .gallery-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      justify-content: center;
    }
    .gallery-thumbs img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.5;
      border: 2px solid transparent;
      transition: 0.2s;
    }
    .gallery-thumbs img.active-thumb {
      opacity: 1;
      border-color: var(--primary);
    }

    /* وێنۆکەکانی بارکردن */
    .images-preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .img-preview-box {
      position: relative;
      width: 65px;
      height: 65px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .img-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .img-delete-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .add-more-img-btn {
      width: 65px;
      height: 65px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: #64748b;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" id="siteLogo">عقارات دەشتی دوستەپە</div>
    <button class="btn btn-admin" onclick="handleAdminBtnClick()">پنێڵی بەڕێوەبەر</button>
  </header>

  <div class="admin-bar" id="adminBar">
    <div class="admin-bar-top">
      <span>👑 دۆخی بەڕێوەبەر چالاکە</span>
      <button onclick="logoutAdmin()" style="background:none; border:none; color:#f87171; font-size:0.8rem; cursor:pointer; font-weight:700;">دەرچوون</button>
    </div>
    <div class="admin-actions">
      <button class="btn btn-primary" onclick="openAddModal()">+ زیادکردنی موڵک</button>
      <button class="btn btn-edit" onclick="openSettingsModal()">⚙️ ڕێکخستنی سایت</button>
    </div>
  </div>

  <section class="hero">
    <h1 id="heroTitle">کڕین و فرۆشتنی زەوی و خانوو</h1>
    <p id="heroDesc">باشترین دەرفەتە بازرگانی و نیشتەجێبوونەکان لە ناوچەی دوستەپە</p>
  </section>

  <div class="container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" onclick="switchMainTab('خانوو', this)">خانوو</button>
      <button class="tab-btn" onclick="switchMainTab('شوێنی تیجاری', this)">شوێنی تیجاری</button>
      <button class="tab-btn" onclick="switchMainTab('زەوی', this)">زەوی</button>
      <button class="tab-btn" onclick="switchMainTab('مەزرەعە', this)">مەزرەعە</button>
    </div>

    <div class="sub-tabs-container" id="landSubTabs">
      <button class="sub-tab-btn active" onclick="switchSubTab('نیشتەجێبوون', this)">نیشتەجێبوون</button>
      <button class="sub-tab-btn" onclick="switchSubTab('زراعی', this)">زراعی</button>
    </div>

    <div class="grid" id="propertiesGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">هیچ موڵکێک لەم بەشەدا بەردەست نییە.</div>
  </div>

  <div class="gallery-modal" id="galleryModal">
    <div class="gallery-header">
      <span id="galleryCounter" style="font-weight:700;">1 / 1</span>
      <span style="font-size:1.8rem; cursor:pointer;" onclick="closeGallery()">×</span>
    </div>
    <div class="gallery-main">
      <button class="gallery-nav-btn gallery-prev" onclick="changeGallerySlide(-1)">❯</button>
      <img id="galleryMainImg" src="" alt="Property View">
      <button class="gallery-nav-btn gallery-next" onclick="changeGallerySlide(1)">❮</button>
    </div>
    <div class="gallery-thumbs" id="galleryThumbs"></div>
  </div>

  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">×</span>
      <h3 class="modal-title">چوونەژوورەوەی بەڕێوەبەر</h3>
      <form onsubmit="verifyPassword(event)">
        <div class="form-group">
          <label>تێپەڕەوشە بنووسە:</label>
          <input type="password" id="adminPassInput" required placeholder="تێپەڕەوشە (1234)">
        </div>
        <p id="loginError" style="color:var(--danger); font-size:0.8rem; margin-bottom:8px; display:none;">تێپەڕەوشە هەڵەیە!</p>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">چوونەژوورەوە</button>
      </form>
    </div>
  </div>

  <div class="modal" id="propertyModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">×</span>
      <h3 class="modal-title" id="modalTitle">زیادکردنی موڵک</h3>
      <form id="propForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>ناوی موڵک:</label>
          <input type="text" id="title" required placeholder="وەک: خانووی مۆدێرن ٢٠٠ مەتر">
        </div>
        <div class="form-group">
          <label>ژمارەی مۆبایلی خاوەن موڵک:</label>
          <input type="text" id="ownerPhone" required placeholder="0750xxxxxxx">
        </div>
        <div class="form-group">
          <label>ناوی شوێن / گەڕەک:</label>
          <input type="text" id="location" required placeholder="وەک: دوستەپە - بەرامبەر پارک">
        </div>
        <div class="form-group">
          <label>لینکی شوێن لە Google Maps (یان ناوی شوێنەکە):</label>
          <input type="text" id="mapLink" placeholder="کۆپی لینکی Shareی نەخشەی گووگڵ">
        </div>
        <div class="form-group">
          <label>بەش (تاب):</label>
          <select id="category" onchange="toggleFormSubCategory()">
            <option value="خانوو">خانوو</option>
            <option value="شوێنی تیجاری">شوێنی تیجاری</option>
            <option value="زەوی">زەوی</option>
            <option value="مەزرەعە">مەزرەعە</option>
          </select>
        </div>
        <div class="form-group" id="formSubCatGroup" style="display:none;">
          <label>جۆری زەوی:</label>
          <select id="subCategory">
            <option value="نیشتەجێبوون">نیشتەجێبوون</option>
            <option value="زراعی">زراعی</option>
          </select>
        </div>
        <div class="form-group">
          <label>جۆری مامەڵە:</label>
          <select id="type">
            <option value="بۆ فرۆشتن">بۆ فرۆشتن</option>
            <option value="بۆ بەکرێدان">بۆ بەکرێدان</option>
          </select>
        </div>
        <div class="form-group">
          <label>نرخ ($):</label>
          <input type="text" id="price" required placeholder="وەک: $85,000">
        </div>
        
        <div class="form-group">
          <label>وێنەکانی موڵک:</label>
          <input type="file" id="hiddenFileInput" accept="image/*" multiple style="display:none;" onchange="handleFileSelection(event)">
          <div class="images-preview-grid" id="imgPreviewGrid">
            <div class="add-more-img-btn" onclick="document.getElementById('hiddenFileInput').click()">
              <span style="font-size:1.3rem;">+</span>
              <span>زیادکردن</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>ڕوونکردنەوە:</label>
          <textarea id="desc" rows="3" required placeholder="زانیاری لەسەر ڕووبەر، پێگە، خزمەتگوزاری..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="savePropBtn" style="width:100%; padding:0.75rem;">پاشەکەوتکردن</button>
      </form>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">×</span>
      <h3 class="modal-title">ڕێکخستنی سەردێڕی سایت</h3>
      <form onsubmit="handleSettingsSubmit(event)">
        <div class="form-group">
          <label>ناوی نوسینگە / ماڵپەڕ:</label>
          <input type="text" id="setSiteName" required>
        </div>
        <div class="form-group">
          <label>سەردێڕی سەرەکی:</label>
          <input type="text" id="setHeroTitle" required>
        </div>
        <div class="form-group">
          <label>دەقی ژێر سەردێڕ:</label>
          <textarea id="setHeroDesc" rows="2" required></textarea>
        </div>
        <div class="form-group">
          <label>تێپەڕەوشەی نوێی پنێڵ:</label>
          <input type="text" id="setAdminPass" required placeholder="تێپەڕەوشەی بەڕێوەبەر">
        </div>
        <button type="submit" class="btn btn-success" style="width:100%; padding:0.75rem;">پاشەکەوتکردن</button>
      </form>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://haqarat-d721a-default-rtdb.firebaseio.com";

    let properties = [];
    let siteSettings = {
      siteName: "عقارات دەشتی دوستەپە",
      heroTitle: "کڕین و فرۆشتنی زەوی و خانوو",
      heroDesc: "باشترین دەرفەتە بازرگانی و نیشتەجێبوونەکان لە ناوچەی دوستەپە",
      adminPass: "1234"
    };

    let uploadedImagesList = [];
    let currentGalleryImages = [];
    let currentGalleryIndex = 0;

    let isAdmin = false;
    let activeMainTab = 'خانوو';
    let activeSubTab = 'نیشتەجێبوون';

    async function loadData() {
      try {
        const res = await fetch(`${FIREBASE_URL}/.json`);
        if (!res.ok) throw new Error("Permission Denied");
        const data = await res.json();

        if (data && data.settings) {
          siteSettings = { ...siteSettings, ...data.settings };
        }
        applySettings();

        if (data && data.properties) {
          properties = Object.values(data.properties);
        } else {
          properties = [];
        }
        renderProperties();
      } catch (err) {
        console.warn("Could not load from Firebase.", err);
      }
    }

    function applySettings() {
      document.getElementById('siteLogo').innerText = siteSettings.siteName;
      document.getElementById('heroTitle').innerText = siteSettings.heroTitle;
      document.getElementById('heroDesc').innerText = siteSettings.heroDesc;
    }

    function switchMainTab(category, btn) {
      activeMainTab = category;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const subTabs = document.getElementById('landSubTabs');
      subTabs.style.display = (category === 'زەوی') ? 'flex' : 'none';
      renderProperties();
    }

    function switchSubTab(subCategory, btn) {
      activeSubTab = subCategory;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProperties();
    }

    function formatMapUrl(link, loc) {
      if (link && (link.startsWith('http://') || link.startsWith('https://'))) {
        return link;
      }
      const query = encodeURIComponent(link || loc || 'Dustapa');
      return `https://www.google.com/maps/search/?api=1&query=${query}`;
    }

    function renderProperties() {
      const grid = document.getElementById('propertiesGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      let list = properties.filter(p => p.category === activeMainTab);

      if (activeMainTab === 'زەوی') {
        list = list.filter(p => p.subCategory === activeSubTab);
      }

      if (list.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        list.forEach(item => {
          const imgs = (item.images && item.images.length > 0) ? item.images : [item.image || "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=600&auto=format&fit=crop"];
          const mainImg = imgs[0];
          const mapHref = formatMapUrl(item.mapLink, item.location);
          const phoneLink = item.ownerPhone ? `tel:${item.ownerPhone}` : '#';

          grid.innerHTML += `
            <div class="card">
              <div class="card-img-wrapper" onclick="openGallery('${item.id}')">
                <img src="${mainImg}" alt="${item.title}" class="card-img" loading="lazy">
                <div class="img-count-badge">📷 ${imgs.length} وێنە</div>
              </div>
              <div class="card-body">
                <div class="badge-group">
                  <span class="badge">${item.type}</span>
                  <span class="badge">${item.category}</span>
                  ${item.subCategory ? `<span class="badge badge-sub">${item.subCategory}</span>` : ''}
                  ${item.location ? `<span class="badge badge-location">📍 ${item.location}</span>` : ''}
                </div>
                <h3 class="card-title" onclick="openGallery('${item.id}')">${item.title}</h3>
                <p class="card-desc">${item.desc}</p>
                
                <div class="map-row">
                  <a href="${mapHref}" target="_blank" rel="noopener noreferrer" class="btn btn-map">
                    🗺️ کردنەوە لە Google Maps
                  </a>
                </div>

                <div class="card-footer">
                  <div class="card-footer-top">
                    <span class="price">${item.price}</span>
                    <button class="btn btn-primary" style="padding:0.4rem 0.8rem; font-size:0.75rem;" onclick="openGallery('${item.id}')">بینینی وێنەکان</button>
                  </div>
                  ${item.ownerPhone ? `<a href="${phoneLink}" class="btn btn-call">📞 پەیوەندی بە خاوەن موڵک (${item.ownerPhone})</a>` : ''}
                </div>
                <div class="card-controls" style="display: ${isAdmin ? 'flex' : 'none'}">
                  <button class="btn btn-edit" style="flex:1" onclick="openEditModal('${item.id}')">دەستکاری</button>
                  <button class="btn btn-danger" style="flex:1" onclick="deleteProperty('${item.id}')">سڕینەوە</button>
                </div>
              </div>
            </div>
          `;
        });
      }
    }

    // پەستاندنی زۆر بەهێز بۆ خێراکردنی سایتەکە (Speed Turbo Optimizer)
    function compressImageTurbo(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 750;
            let width = img.width;
            let height = img.height;

            if (width > height && width > MAX_SIZE) {
              height = Math.round((height * MAX_SIZE) / width);
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width = Math.round((width * MAX_SIZE) / height);
              height = MAX_SIZE;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
        };
      });
    }

    async function handleFileSelection(event) {
      const files = event.target.files;
      if (!files) return;

      for (let i = 0; i < files.length; i++) {
        const compressed = await compressImageTurbo(files[i]);
        uploadedImagesList.push(compressed);
      }
      renderUploadPreviews();
      event.target.value = '';
    }

    function renderUploadPreviews() {
      const grid = document.getElementById('imgPreviewGrid');
      grid.innerHTML = '';

      uploadedImagesList.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'img-preview-box';
        box.innerHTML = `
          <img src="${src}">
          <button type="button" class="img-delete-btn" onclick="removeImage(${idx})">×</button>
        `;
        grid.appendChild(box);
      });

      const addBtn = document.createElement('div');
      addBtn.className = 'add-more-img-btn';
      addBtn.onclick = () => document.getElementById('hiddenFileInput').click();
      addBtn.innerHTML = '<span style="font-size:1.3rem;">+</span><span>زیادکردن</span>';
      grid.appendChild(addBtn);
    }

    function removeImage(index) {
      uploadedImagesList.splice(index, 1);
      renderUploadPreviews();
    }

    // گەلەری وێنەکان
    function openGallery(id) {
      const item = properties.find(p => String(p.id) === String(id));
      if (!item) return;

      currentGalleryImages = (item.images && item.images.length > 0) ? item.images : [item.image];
      currentGalleryIndex = 0;
      updateGalleryView();
      document.getElementById('galleryModal').style.display = 'flex';
    }

    function updateGalleryView() {
      const mainImg = document.getElementById('galleryMainImg');
      const counter = document.getElementById('galleryCounter');
      const thumbs = document.getElementById('galleryThumbs');

      mainImg.src = currentGalleryImages[currentGalleryIndex];
      counter.innerText = `${currentGalleryIndex + 1} / ${currentGalleryImages.length}`;

      thumbs.innerHTML = '';
      currentGalleryImages.forEach((src, idx) => {
        const thumb = document.createElement('img');
        thumb.src = src;
        if (idx === currentGalleryIndex) thumb.classList.add('active-thumb');
        thumb.onclick = () => {
          currentGalleryIndex = idx;
          updateGalleryView();
        };
        thumbs.appendChild(thumb);
      });
    }

    function changeGallerySlide(direction) {
      currentGalleryIndex += direction;
      if (currentGalleryIndex < 0) currentGalleryIndex = currentGalleryImages.length - 1;
      if (currentGalleryIndex >= currentGalleryImages.length) currentGalleryIndex = 0;
      updateGalleryView();
    }

    function closeGallery() {
      document.getElementById('galleryModal').style.display = 'none';
    }

    function toggleFormSubCategory() {
      const cat = document.getElementById('category').value;
      const subGroup = document.getElementById('formSubCatGroup');
      subGroup.style.display = (cat === 'زەوی') ? 'block' : 'none';
    }

    function handleAdminBtnClick() {
      if (isAdmin) {
        logoutAdmin();
      } else {
        document.getElementById('adminPassInput').value = '';
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function verifyPassword(e) {
      e.preventDefault();
      const enteredPass = document.getElementById('adminPassInput').value;
      const actualPass = siteSettings.adminPass || "1234";

      if (enteredPass === actualPass) {
        isAdmin = true;
        document.getElementById('adminBar').style.display = 'flex';
        closeModals();
        renderProperties();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('adminBar').style.display = 'none';
      renderProperties();
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = "زیادکردنی موڵک";
      document.getElementById('propForm').reset();
      document.getElementById('editId').value = "";
      uploadedImagesList = [];
      renderUploadPreviews();
      document.getElementById('ownerPhone').value = "";
      document.getElementById('location').value = "";
      document.getElementById('mapLink').value = "";
      document.getElementById('category').value = activeMainTab;
      toggleFormSubCategory();
      document.getElementById('propertyModal').style.display = 'flex';
    }

    function openEditModal(id) {
      const item = properties.find(p => String(p.id) === String(id));
      if (!item) return;

      document.getElementById('modalTitle').innerText = "دەستکاریکردنی موڵک";
      document.getElementById('editId').value = item.id;
      document.getElementById('title').value = item.title;
      document.getElementById('ownerPhone').value = item.ownerPhone || '';
      document.getElementById('location').value = item.location || '';
      document.getElementById('mapLink').value = item.mapLink || '';
      document.getElementById('category').value = item.category || 'خانوو';
      toggleFormSubCategory();
      if (item.subCategory) document.getElementById('subCategory').value = item.subCategory;
      document.getElementById('type').value = item.type;
      document.getElementById('price').value = item.price;
      document.getElementById('desc').value = item.desc;
      uploadedImagesList = (item.images && item.images.length > 0) ? [...item.images] : [item.image];
      renderUploadPreviews();
      document.getElementById('propertyModal').style.display = 'flex';
    }

    function openSettingsModal() {
      document.getElementById('setSiteName').value = siteSettings.siteName;
      document.getElementById('setHeroTitle').value = siteSettings.heroTitle;
      document.getElementById('setHeroDesc').value = siteSettings.heroDesc;
      document.getElementById('setAdminPass').value = siteSettings.adminPass || "1234";
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('savePropBtn');
      saveBtn.innerText = "چاوەڕێبە...";
      saveBtn.disabled = true;

      const editId = document.getElementById('editId').value;
      const title = document.getElementById('title').value;
      const ownerPhone = document.getElementById('ownerPhone').value;
      const location = document.getElementById('location').value;
      const mapLink = document.getElementById('mapLink').value;
      const category = document.getElementById('category').value;
      const subCategory = (category === 'زەوی') ? document.getElementById('subCategory').value : '';
      const type = document.getElementById('type').value;
      const price = document.getElementById('price').value;
      const desc = document.getElementById('desc').value;

      const finalImages = (uploadedImagesList.length > 0) ? uploadedImagesList : ["https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=600&auto=format&fit=crop"];

      const propId = editId ? editId : 'p_' + Date.now();
      const propObj = { 
        id: propId, 
        title, 
        ownerPhone,
        location, 
        mapLink, 
        category, 
        subCategory, 
        type, 
        price, 
        desc, 
        images: finalImages,
        image: finalImages[0] 
      };

      try {
        const res = await fetch(`${FIREBASE_URL}/properties/${propId}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(propObj)
        });

        if (!res.ok) throw new Error("Firebase Rules Denied!");

        await loadData();
        closeModals();
        alert("موڵکەکە پاشەکەوت کرا!");
      } catch (err) {
        alert("هەڵە ڕوویدا لە بارکردنی موڵک!");
      } finally {
        saveBtn.innerText = "پاشەکەوتکردن";
        saveBtn.disabled = false;
      }
    }

    async function handleSettingsSubmit(e) {
      e.preventDefault();
      siteSettings = {
        siteName: document.getElementById('setSiteName').value,
        heroTitle: document.getElementById('setHeroTitle').value,
        heroDesc: document.getElementById('setHeroDesc').value,
        adminPass: document.getElementById('setAdminPass').value
      };

      try {
        await fetch(`${FIREBASE_URL}/settings.json`, {
          method: 'PUT',
          body: JSON.stringify(siteSettings)
        });
        applySettings();
        closeModals();
        alert("ڕێکخستنەکان پاشەکەوت کران!");
      } catch (err) {
        alert("نەتوانرا پاشەکەوت بکرێت!");
      }
    }

    async function deleteProperty(id) {
      if (confirm("ئایا دڵنیایت لە سڕینەوەی ئەم موڵکە؟")) {
        try {
          await fetch(`${FIREBASE_URL}/properties/${id}.json`, {
            method: 'DELETE'
          });
          await loadData();
        } catch (err) {
          alert("نەتوانرا بسڕدرێتەوە!");
        }
      }
    }

    loadData();
  </script>
</body>
</html>
