<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>عقارات دەشتی دوستەپە</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #10b981;
      --dark: #0f172a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #ef4444;
      --edit: #f59e0b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .logo { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .btn {
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-admin { background: var(--dark); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--accent); color: #fff; }
    .btn-edit { background: var(--edit); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    .admin-bar {
      background: #0f172a;
      color: #fff;
      padding: 0.75rem 1rem;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .admin-bar-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .admin-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
    }
    .hero h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; }
    .hero p { color: #94a3b8; font-size: 0.85rem; max-width: 500px; margin: auto; }

    .container { max-width: 1100px; margin: auto; padding: 1.2rem 1rem; }

    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    
    .tab-btn {
      padding: 0.65rem 1.2rem;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .sub-tabs-container {
      display: none;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 10px;
      margin-bottom: 15px;
      gap: 5px;
    }
    .sub-tab-btn {
      flex: 1;
      padding: 0.5rem;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }
    .sub-tab-btn.active {
      background: #ffffff;
      color: var(--dark);
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .grid { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    @media(min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media(min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }
    .card-img { width: 100%; height: 210px; object-fit: cover; display: block; background: #e2e8f0; }
    .card-body { padding: 1rem; }
    .badge-group { display: flex; gap: 5px; margin-bottom: 0.5rem; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      background: #e0f2fe;
      color: var(--primary);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-sub { background: #fef3c7; color: #b45309; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--dark); margin-bottom: 0.4rem; }
    .card-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.8rem; line-height: 1.5; }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 0.75rem;
    }
    .price { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .card-controls { display: none; gap: 6px; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }

    .mobile-contact-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 150;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.06);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    @media(min-width: 640px) { .modal { align-items: center; } }

    .modal-content {
      background: #fff;
      padding: 1.3rem;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }
    @media(min-width: 640px) { .modal-content { border-radius: 16px; } }

    .modal-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .close-btn { position: absolute; left: 1rem; top: 1rem; cursor: pointer; font-size: 1.4rem; font-weight: 800; color: #94a3b8; }
    .empty-state { text-align: center; color: var(--muted); padding: 3.5rem 1rem; font-size: 0.95rem; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="logo" id="siteLogo">عقارات دەشتی دوستەپە</div>
    <button class="btn btn-admin" id="adminToggleBtn" onclick="handleAdminBtnClick()">پنێڵی بەڕێوەبەر</button>
  </header>

  <div class="admin-bar" id="adminBar">
    <div class="admin-bar-top">
      <span>👑 دۆخی بەڕێوەبەر چالاکە</span>
      <button onclick="logoutAdmin()" style="background:none; border:none; color:#f87171; font-size:0.8rem; cursor:pointer; font-weight:700;">دەرچوون</button>
    </div>
    <div class="admin-actions">
      <button class="btn btn-primary" onclick="openAddModal()">+ زیادکردنی موڵک</button>
      <button class="btn btn-edit" onclick="openSettingsModal()">⚙️ ڕێکخستنی سایت</button>
    </div>
  </div>

  <section class="hero">
    <h1 id="heroTitle">کڕین و فرۆشتنی زەوی و خانوو</h1>
    <p id="heroDesc">باشترین دەرفەتە بازرگانی و نیشتەجێبوونەکان لە ناوچەی دوستەپە</p>
  </section>

  <div class="container">
    <div class="tabs-wrapper">
      <button class="tab-btn active" onclick="switchMainTab('خانوو', this)">خانوو</button>
      <button class="tab-btn" onclick="switchMainTab('شوێنی تیجاری', this)">شوێنی تیجاری</button>
      <button class="tab-btn" onclick="switchMainTab('زەوی', this)">زەوی</button>
      <button class="tab-btn" onclick="switchMainTab('مەزرەعە', this)">مەزرەعە</button>
    </div>

    <div class="sub-tabs-container" id="landSubTabs">
      <button class="sub-tab-btn active" onclick="switchSubTab('نیشتەجێبوون', this)">نیشتەجێبوون</button>
      <button class="sub-tab-btn" onclick="switchSubTab('زراعی', this)">زراعی</button>
    </div>

    <div class="grid" id="propertiesGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">هیچ موڵکێک لەم بەشەدا بەردەست نییە.</div>
  </div>

  <div class="mobile-contact-bar">
    <a href="tel:07500000000" id="callLink" class="btn btn-primary">📞 پەیوەندی</a>
    <a href="https://wa.me/9647500000000" id="waLink" class="btn btn-success">💬 واتسئاپ</a>
  </div>

  <!-- مۆداڵی پاسۆردی بەڕێوەبەر -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">&times;</span>
      <h3 class="modal-title">چوونەژوورەوەی بەڕێوەبەر</h3>
      <form onsubmit="verifyPassword(event)">
        <div class="form-group">
          <label>تێپەڕەوشە بنووسە:</label>
          <input type="password" id="adminPassInput" required placeholder="تێپەڕەوشە (1234)">
        </div>
        <p id="loginError" style="color:var(--danger); font-size:0.8rem; margin-bottom:8px; display:none;">تێپەڕەوشە هەڵەیە!</p>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">چوونەژوورەوە</button>
      </form>
    </div>
  </div>

  <!-- مۆداڵی زیادکردن/دەستکاری -->
  <div class="modal" id="propertyModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">&times;</span>
      <h3 class="modal-title" id="modalTitle">زیادکردنی موڵک</h3>
      <form id="propForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>ناوی موڵک:</label>
          <input type="text" id="title" required placeholder="وەک: خانووی مۆدێرن ٢٠٠ مەتر">
        </div>
        <div class="form-group">
          <label>بەش (تاب):</label>
          <select id="category" onchange="toggleFormSubCategory()">
            <option value="خانوو">خانوو</option>
            <option value="شوێنی تیجاری">شوێنی تیجاری</option>
            <option value="زەوی">زەوی</option>
            <option value="مەزرەعە">مەزرەعە</option>
          </select>
        </div>
        <div class="form-group" id="formSubCatGroup" style="display:none;">
          <label>جۆری زەوی:</label>
          <select id="subCategory">
            <option value="نیشتەجێبوون">نیشتەجێبوون</option>
            <option value="زراعی">زراعی</option>
          </select>
        </div>
        <div class="form-group">
          <label>جۆری مامەڵە:</label>
          <select id="type">
            <option value="بۆ فرۆشتن">بۆ فرۆشتن</option>
            <option value="بۆ بەکرێدان">بۆ بەکرێدان</option>
          </select>
        </div>
        <div class="form-group">
          <label>نرخ ($):</label>
          <input type="text" id="price" required placeholder="وەک: $85,000">
        </div>
        <div class="form-group">
          <label>وێنەی موڵک:</label>
          <input type="file" id="imageFile" accept="image/*" onchange="processImage(event)">
          <input type="hidden" id="imageData">
        </div>
        <div class="form-group">
          <label>ڕوونکردنەوە:</label>
          <textarea id="desc" rows="3" required placeholder="زانیاری لەسەر ڕووبەر، شوێن، خزمەتگوزاری..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">پاشەکەوتکردن</button>
      </form>
    </div>
  </div>

  <!-- مۆداڵی ڕێکخستنی سایت -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">&times;</span>
      <h3 class="modal-title">ڕێکخستنی زانیارییەکان</h3>
      <form onsubmit="handleSettingsSubmit(event)">
        <div class="form-group">
          <label>ناوی نوسینگە / ماڵپەڕ:</label>
          <input type="text" id="setSiteName" required>
        </div>
        <div class="form-group">
          <label>سەردێڕی سەرەکی:</label>
          <input type="text" id="setHeroTitle" required>
        </div>
        <div class="form-group">
          <label>دەقی ژێر سەردێڕ:</label>
          <textarea id="setHeroDesc" rows="2" required></textarea>
        </div>
        <div class="form-group">
          <label>ژمارەی تەلەفۆن:</label>
          <input type="text" id="setPhone" required placeholder="0750xxxxxxx">
        </div>
        <div class="form-group">
          <label>ژمارەی واتسئاپ:</label>
          <input type="text" id="setWa" required placeholder="964750xxxxxxx">
        </div>
        <div class="form-group">
          <label>تێپەڕەوشەی نوێی پنێڵ:</label>
          <input type="text" id="setAdminPass" required placeholder="تێپەڕەوشەی بەڕێوەبەر">
        </div>
        <button type="submit" class="btn btn-success" style="width:100%; padding:0.75rem;">پاشەکەوتکردن</button>
      </form>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        id: 1,
        title: "خانووی مۆدێرنی نیشتەجێبوون",
        category: "خانوو",
        subCategory: "",
        type: "بۆ فرۆشتن",
        price: "$85,000",
        image: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=600&auto=format&fit=crop",
        desc: "ڕووبەری ٢٠٠ مەتر، دوو نهۆم، هەموو خزمەتگوزارییەکان ئامادەن."
      },
      {
        id: 2,
        title: "زەوی نیشتەجێبوون لە کەرتی ۲",
        category: "زەوی",
        subCategory: "نیشتەجێبوون",
        type: "بۆ فرۆشتن",
        price: "$35,000",
        image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop",
        desc: "ڕووبەری ٢٥٠ مەتر، تاپۆی نیشتەجێبوون و شوێنێکی زۆر بەرز."
      },
      {
        id: 3,
        title: "زەوی زراعی بەپیت بۆ باخ",
        category: "زەوی",
        subCategory: "زراعی",
        type: "بۆ فرۆشتن",
        price: "$18,000",
        image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop",
        desc: "ڕووبەری ١ دۆنم، گونجاوە بۆ باخ و کشتوکاڵ."
      },
      {
        id: 4,
        title: "دوکانی تیجاری لەسەر شەقامی سەرەکی",
        category: "شوێنی تیجاری",
        subCategory: "",
        type: "بۆ بەکرێدان",
        price: "$500 / مانگانە",
        image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop",
        desc: "شوێنێکی ستراتیژی بۆ بازرگانی و کارکردن."
      },
      {
        id: 5,
        title: "مەزرەعەی تەواو بە باخ و ڤێلاوە",
        category: "مەزرەعە",
        subCategory: "",
        type: "بۆ فرۆشتن",
        price: "$120,000",
        image: "https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=600&auto=format&fit=crop",
        desc: "مەزرەعەی تەواو کراو بە بیر و دیواری چواردەور و کارەبا."
      }
    ];

    const defaultSettings = {
      siteName: "عقارات دەشتی دوستەپە",
      heroTitle: "کڕین و فرۆشتنی زەوی و خانوو",
      heroDesc: "باشترین دەرفەتە بازرگانی و نیشتەجێبوونەکان لە ناوچەی دوستەپە",
      phone: "07500000000",
      whatsapp: "9647500000000",
      adminPass: "1234"
    };

    let properties = JSON.parse(localStorage.getItem('dashti_final_props')) || defaultData;
    let siteSettings = JSON.parse(localStorage.getItem('dashti_settings')) || defaultSettings;
    let isAdmin = false;
    let activeMainTab = 'خانوو';
    let activeSubTab = 'نیشتەجێبوون';

    function applySettings() {
      document.getElementById('siteLogo').innerText = siteSettings.siteName;
      document.getElementById('heroTitle').innerText = siteSettings.heroTitle;
      document.getElementById('heroDesc').innerText = siteSettings.heroDesc;
      document.getElementById('callLink').href = `tel:${siteSettings.phone}`;
      document.getElementById('waLink').href = `https://wa.me/${siteSettings.whatsapp.replace(/\+/g, '')}`;
    }

    function switchMainTab(category, btn) {
      activeMainTab = category;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const subTabs = document.getElementById('landSubTabs');
      subTabs.style.display = (category === 'زەوی') ? 'flex' : 'none';
      renderProperties();
    }

    function switchSubTab(subCategory, btn) {
      activeSubTab = subCategory;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProperties();
    }

    function renderProperties() {
      const grid = document.getElementById('propertiesGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      let list = properties.filter(p => p.category === activeMainTab);

      if (activeMainTab === 'زەوی') {
        list = list.filter(p => p.subCategory === activeSubTab);
      }

      if (list.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        list.forEach(item => {
          grid.innerHTML += `
            <div class="card">
              <img src="${item.image}" alt="${item.title}" class="card-img">
              <div class="card-body">
                <div class="badge-group">
                  <span class="badge">${item.type}</span>
                  <span class="badge">${item.category}</span>
                  ${item.subCategory ? `<span class="badge badge-sub">${item.subCategory}</span>` : ''}
                </div>
                <h3 class="card-title">${item.title}</h3>
                <p class="card-desc">${item.desc}</p>
                <div class="card-footer">
                  <span class="price">${item.price}</span>
                </div>
                <div class="card-controls" style="display: ${isAdmin ? 'flex' : 'none'}">
                  <button class="btn btn-edit" style="flex:1" onclick="openEditModal(${item.id})">دەستکاری</button>
                  <button class="btn btn-danger" style="flex:1" onclick="deleteProperty(${item.id})">سڕینەوە</button>
                </div>
              </div>
            </div>
          `;
        });
      }
    }

    function toggleFormSubCategory() {
      const cat = document.getElementById('category').value;
      const subGroup = document.getElementById('formSubCatGroup');
      subGroup.style.display = (cat === 'زەوی') ? 'block' : 'none';
    }

    function handleAdminBtnClick() {
      if (isAdmin) {
        logoutAdmin();
      } else {
        document.getElementById('adminPassInput').value = '';
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function verifyPassword(e) {
      e.preventDefault();
      const enteredPass = document.getElementById('adminPassInput').value;
      const actualPass = siteSettings.adminPass || "1234";

      if (enteredPass === actualPass) {
        isAdmin = true;
        document.getElementById('adminBar').style.display = 'flex';
        closeModals();
        renderProperties();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('adminBar').style.display = 'none';
      renderProperties();
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = "زیادکردنی موڵک";
      document.getElementById('propForm').reset();
      document.getElementById('editId').value = "";
      document.getElementById('imageData').value = "";
      document.getElementById('category').value = activeMainTab;
      toggleFormSubCategory();
      document.getElementById('propertyModal').style.display = 'flex';
    }

    function openEditModal(id) {
      const item = properties.find(p => p.id === id);
      if (!item) return;

      document.getElementById('modalTitle').innerText = "دەستکاریکردنی موڵک";
      document.getElementById('editId').value = item.id;
      document.getElementById('title').value = item.title;
      document.getElementById('category').value = item.category || 'خانوو';
      toggleFormSubCategory();
      if (item.subCategory) document.getElementById('subCategory').value = item.subCategory;
      document.getElementById('type').value = item.type;
      document.getElementById('price').value = item.price;
      document.getElementById('desc').value = item.desc;
      document.getElementById('imageData').value = item.image;
      document.getElementById('propertyModal').style.display = 'flex';
    }

    function openSettingsModal() {
      document.getElementById('setSiteName').value = siteSettings.siteName;
      document.getElementById('setHeroTitle').value = siteSettings.heroTitle;
      document.getElementById('setHeroDesc').value = siteSettings.heroDesc;
      document.getElementById('setPhone').value = siteSettings.phone;
      document.getElementById('setWa').value = siteSettings.whatsapp;
      document.getElementById('setAdminPass').value = siteSettings.adminPass || "1234";
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    function processImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDimension = 600;
            let width = img.width;
            let height = img.height;

            if (width > height && width > maxDimension) {
              height *= maxDimension / width;
              width = maxDimension;
            } else if (height > maxDimension) {
              width *= maxDimension / height;
              height = maxDimension;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            document.getElementById('imageData').value = canvas.toDataURL('image/jpeg', 0.6);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const subCategory = (category === 'زەوی') ? document.getElementById('subCategory').value : '';
      const type = document.getElementById('type').value;
      const price = document.getElementById('price').value;
      const desc = document.getElementById('desc').value;
      const image = document.getElementById('imageData').value || "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=600&auto=format&fit=crop";

      if (editId) {
        const idx = properties.findIndex(p => p.id == editId);
        if (idx !== -1) properties[idx] = { id: Number(editId), title, category, subCategory, type, price, desc, image };
      } else {
        properties.unshift({ id: Date.now(), title, category, subCategory, type, price, desc, image });
      }

      localStorage.setItem('dashti_final_props', JSON.stringify(properties));
      renderProperties();
      closeModals();
    }

    function handleSettingsSubmit(e) {
      e.preventDefault();
      siteSettings = {
        siteName: document.getElementById('setSiteName').value,
        heroTitle: document.getElementById('setHeroTitle').value,
        heroDesc: document.getElementById('setHeroDesc').value,
        phone: document.getElementById('setPhone').value,
        whatsapp: document.getElementById('setWa').value,
        adminPass: document.getElementById('setAdminPass').value
      };

      localStorage.setItem('dashti_settings', JSON.stringify(siteSettings));
      applySettings();
      closeModals();
    }

    function deleteProperty(id) {
      if (confirm("ئایا دڵنیایت لە سڕینەوەی ئەم موڵکە؟")) {
        properties = properties.filter(item => item.id !== id);
        localStorage.setItem('dashti_final_props', JSON.stringify(properties));
        renderProperties();
      }
    }

    applySettings();
    renderProperties();
  </script>
</body>
</html>
